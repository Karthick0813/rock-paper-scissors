<!DOCTYPE html>
<html>
    <title>DOM</title>
    <head>
        <base target="_blank">
    </head>
    <style>
        .subbut{
            background-color: rgb(67, 66, 66);
            color: white;
            width: 150px;
            height: 40px;
            border-radius: 20px;
        }
    </style>
    <body>
        <p>Click here to Subscribe</p>
        <button onclick="sub()" class="subbut">Subscribe</button>
        <br><br>
        <p>Click here to open game</p>
        <a href="http://127.0.0.1:5500/RPC.html" rel="noopener noreferrer">RPS</a>
    </body>
    <script>
        let s=0;
        function sub()
        {
            if(s===0)
            {
                document.querySelector('.subbut').innerHTML='Subscribed';
                s=1;
            }else{
                document.querySelector('.subbut').innerHTML='Subscribe';
                s=0;
            }
            
        }
    </script>
</html>
