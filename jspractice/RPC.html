<!DOCTYPE html>
<html>
    <title>ROCK PAPER SCISSORS</title>
    <body>
        <p>ROCK PAPER SCISSORS</p>
        <button
            onclick="
            play('ROCK');
            "
        >ROCK</button>
        <button
        onclick="
            play('PAPER');
            "
        >PAPER</button>
        <button
        onclick="
            play('SCISSORS');
            "
        >SCISSORS</button>
    </body>
    <script>
        let cmove;
        let rmove;
        let res;
        function play(pmove){
            pickmove();
            if(pmove==='ROCK'){
                if(rmove<1/3){
                    res='TIE';
                }
                else if(rmove<2/3)
                {
                    res='LOSE';
                }
                else{
                    res='WIN';
                }
            }
            else if(pmove==='PAPER'){
                if(rmove<1/3)
                {
                    res='WIN';
                }
                else if(rmove<2/3)
                {
                    res='TIE';
                }
                else{
                    res='LOSE';
                }
            }
            else{
                if(rmove<1/3)
                {
                    res='LOSE';
                }
                else if(rmove<2/3)
                {
                    res='WIN';
                }
                else{
                    res='TIE';
                }
            }
            alert('You picked '+pmove+' Computer picked '+cmove+' RESULT : '+res);
        }
        function pickmove(){
            rmove=Math.random();
            if(rmove<1/3)
            {
                cmove='ROCK';
            }
            else if(rmove<2/3)
            {
                cmove='PAPER';
            }
            else{
                cmove='SCISSORS';
            }
        }
    </script>
</html>
