<!DOCTYPE html>
<html>
    <title>ROCK PAPER SCISSORS</title>
    <body>
        <p>ROCK PAPER SCISSORS</p>
        <button
            onclick="
            play('ROCK');
            "
        >ROCK</button>
        <button
        onclick="
            play('PAPER');
            "
        >PAPER</button>
        <button
        onclick="
            play('SCISSORS');
            "
        >SCISSORS</button>
        <button onclick="reset();">RESET</button>
    </body>
    <script>
        let cmove;
        let rmove;
        let res;
        let score=JSON.parse(localStorage.getItem('score'))||{'Wins':0,'Loses':0,'Tie':0};
        function play(pmove){
            pickmove();
            if(pmove==='ROCK'){
                if(rmove<1/3){
                    res='TIE';
                }
                else if(rmove<2/3)
                {
                    res='LOSE';
                }
                else{
                    res='WIN';
                }
            }
            else if(pmove==='PAPER'){
                if(rmove<1/3)
                {
                    res='WIN';
                }
                else if(rmove<2/3)
                {
                    res='TIE';
                }
                else{
                    res='LOSE';
                }
            }
            else{
                if(rmove<1/3)
                {
                    res='LOSE';
                }
                else if(rmove<2/3)
                {
                    res='WIN';
                }
                else{
                    res='TIE';
                }
            }
            if(res==='WIN')
            {
                score.Wins+=1;
            }
            else if(res==='LOSE')
            {
                score.Loses+=1;
            }
            else{
                score.Tie+=1;
            }
            localStorage.setItem('score',JSON.stringify(score));
            alert('You picked '+pmove+' Computer picked '+cmove+' RESULT : '+res+`
            WINS : ${score.Wins} LOSES : ${score.Loses} Ties : ${score.Tie}`);
        }
        function pickmove(){
            rmove=Math.random();
            if(rmove<1/3)
            {
                cmove='ROCK';
            }
            else if(rmove<2/3)
            {
                cmove='PAPER';
            }
            else{
                cmove='SCISSORS';
            }
        }
        function reset()
        {
            score.Wins=0;
            score.Loses=0;
            score.Tie=0;
            localStorage.removeItem('score');
            alert(`WINS : ${score.Wins} LOSES : ${score.Loses} Ties : ${score.Tie}`);
        }
    </script>
</html>
